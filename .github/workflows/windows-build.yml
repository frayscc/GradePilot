name: Windows portable build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev,windows,portable]"

      - name: Run tests
        run: python -m pytest

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            if ($version -ne $packageVersion) {
              throw "Tag version $version does not match package version $packageVersion"
            }
          } else {
            $version = $packageVersion
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIGrader-v${{ steps.version.outputs.value }}-Windows-x64
          path: dist/AIGrader-v${{ steps.version.outputs.value }}-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIGrader-v${{ steps.version.outputs.value }}-Windows-x64.zip
          generate_release_notes: true

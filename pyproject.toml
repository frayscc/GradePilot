[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aigrader-prototype"
version = "0.0.1"
description = "AIGrader Phase 0 Windows technical verification prototype"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mss>=10,<11",
  "Pillow>=10,<12",
  "pyautogui>=0.9.54,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
windows = ["keyboard>=0.13.5,<1"]

[project.scripts]
aigrader-prototype = "aigrader_proto.cli:main"

[tool.setuptools]
package-dir = {"" = "prototype"}

[tool.setuptools.packages.find]
where = ["prototype"]

[tool.pytest.ini_options]
testpaths = ["prototype/tests"]
addopts = "-q"

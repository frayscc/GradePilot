[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aigrader"
version = "0.3.0"
description = "AIGrader Phase 3 Windows automation and grading core"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mss>=10,<11",
  "Pillow>=10,<12",
  "PySide6-Essentials>=6.7,<7",
  "pyautogui>=0.9.54,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
windows = ["keyboard>=0.13.5,<1"]

[project.scripts]
aigrader = "app.main:main"
aigrader-prototype = "prototype.aigrader_proto.cli:main"

[tool.setuptools]
packages = [
  "app", "app.ai", "app.core", "app.data", "app.platforms", "app.ui",
  "prototype", "prototype.aigrader_proto",
]

[tool.pytest.ini_options]
testpaths = ["tests", "prototype/tests"]
addopts = "-q"
